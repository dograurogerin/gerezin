<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerezin Salgados</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Pedidos gerezin</h1>
    <p>Gerenciamento de encomendas</p>
</header>

<nav>
    <button class="active" data-page="cadastro">
        Novo Pedido
    </button>

    <button data-page="mural">
        Mural de Pedidos
    </button>
</nav>

<main>

    <!-- CADASTRO DE PEDIDOS -->

    <section id="cadastro" class="pagina active">

        <div class="formulario">

            <h2>Cadastrar pedido</h2>

            <form id="pedidoForm">

                <label for="nome">Nome do cliente</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                    required
                >

                <label for="telefone">Telefone</label>
                <input
                    type="tel"
                    id="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

                <label for="quantidade">
                    Quantidade de salgadinhos
                </label>

                <input
                    type="number"
                    id="quantidade"
                    min="1"
                    placeholder="Ex: 100"
                    required
                >

                <label for="tipo">Tipo de salgadinho</label>

                <select id="tipo" required>
                    <option value="">Selecione</option>
                    <option value="Mini">Mini</option>
                    <option value="Festa">Festa</option>
                </select>

                <label for="horario">Horário do pedido</label>

                <input
                    type="time"
                    id="horario"
                    required
                >

                <label for="recebimento">
                    Tipo de recebimento
                </label>

                <select id="recebimento" required>
                    <option value="">Selecione</option>
                    <option value="Retirada">Retirada</option>
                    <option value="Entrega">Entrega</option>
                </select>

                <div id="campoEndereco" class="campo-endereco">

                    <label for="endereco">
                        Endereço de entrega
                    </label>

                    <textarea
                        id="endereco"
                        placeholder="Rua, número, bairro e complemento"
                    ></textarea>

                </div>

                <label for="pagamento">
                    Forma de pagamento
                </label>

                <select id="pagamento" required>
                    <option value="">Selecione</option>
                    <option value="PIX">PIX</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>

                <label for="valor">
                    Valor do pedido (R$)
                </label>

                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="Ex: 75,00"
                    required
                >

                <label for="observacoes">
                    Observações
                </label>

                <textarea
                    id="observacoes"
                    placeholder="Sabores, detalhes, informações adicionais..."
                ></textarea>

                <button type="submit" class="salvar">
                    Salvar pedido
                </button>

            </form>

        </div>

    </section>


    <!-- MURAL DE PEDIDOS -->

    <section id="mural" class="pagina">

        <h2>Mural de pedidos</h2>

        <div class="resumo">

            <div>
                Todos:
                <strong id="total">0</strong>
            </div>

            <div>
                Em preparo:
                <strong id="preparo">0</strong>
            </div>

            <div>
                Finalizados:
                <strong id="finalizados">0</strong>
            </div>

            <div>
                Entregues:
                <strong id="entregues">0</strong>
            </div>

            <div class="resumo-pago">
                Pagos:
                <strong id="pagos">0</strong>
            </div>

            <div class="resumo-pendente">
                Não pagos:
                <strong id="naoPagos">0</strong>
            </div>

        </div>

        <input
            type="search"
            id="busca"
            class="busca"
            placeholder="🔎 Pesquisar por nome ou telefone..."
        >

        <div id="listaPedidos" class="mural"></div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
