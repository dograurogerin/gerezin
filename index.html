<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerezin</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pedidos Gerezin</h1>
        <p>Gerenciamento de encomendas</p>
    </header>

    <nav>
        <button class="active" data-page="cadastro">
            Novo Pedido
        </button>

        <button data-page="mural">
            Mural de Pedidos
        </button>
    </nav>

    <main>

        <!-- PÁGINA DE CADASTRO -->
        <section id="cadastro" class="pagina active">

            <div class="formulario">

                <h2>Cadastrar pedido</h2>

                <form id="pedidoForm">

                    <label for="nome">Nome do cliente</label>
                    <input
                        type="text"
                        id="nome"
                        placeholder="Nome completo"
                        required
                    >

                    <label for="telefone">Telefone</label>
                    <input
                        type="tel"
                        id="telefone"
                        placeholder="(00) 00000-0000"
                        required
                    >

                    <label for="quantidade">
                        Quantidade de salgadinhos
                    </label>

                    <input
                        type="number"
                        id="quantidade"
                        min="1"
                        placeholder="Ex: 100"
                        required
                    >

                    <label for="tipo">
                        Tipo de salgadinho
                    </label>

                    <select id="tipo" required>
                        <option value="">Selecione</option>
                        <option value="Mini">Mini</option>
                        <option value="Festa">Festa</option>
                    </select>

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        placeholder="Sabores, horários, detalhes..."
                    ></textarea>

                    <button type="submit" class="salvar">
                        Salvar pedido
                    </button>

                </form>

            </div>

        </section>


        <!-- PÁGINA DO MURAL -->
        <section id="mural" class="pagina">

            <h2>Mural de pedidos</h2>

            <!-- CONTADORES -->
            <div class="resumo">

                <div>
                    Todos:
                    <strong id="total">0</strong>
                </div>

                <div>
                    Em preparo:
                    <strong id="preparo">0</strong>
                </div>

                <div>
                    Finalizados:
                    <strong id="finalizados">0</strong>
                </div>

                <div>
                    Entregues:
                    <strong id="entregues">0</strong>
                </div>

            </div>


            <!-- BUSCA -->
            <input
                type="search"
                id="busca"
                class="busca"
                placeholder="🔎 Pesquisar por nome ou telefone..."
            >


            <!-- FICHAS DOS PEDIDOS -->
            <div id="listaPedidos" class="mural">

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
